name: Deploy Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/admin/**'
      - 'packages/**'

jobs:
  deploy-web:
    name: Deploy Marketing Website
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/web') || contains(github.event.head_commit.modified, 'packages')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          working-directory: ./apps/web
          vercel-args: '--prod'

  deploy-admin:
    name: Deploy Admin Dashboard
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/admin') || contains(github.event.head_commit.modified, 'packages')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: ./apps/admin
          vercel-args: '--prod'
